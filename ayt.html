.services {

 background-color: yellow;
 font-size: 47px;
}

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .card {
      background: #21cbf1;
      color: #f0e739;
      border-radius: 10px;
      overflow: hidden;
      width: 260px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgb(192, 1, 1);
    }

    .card img {
      width: 100%;
      height:250px;
      object-fit: cover;
    }  
    .card button{
     background: rgba(61, 2, 237, 0.318); 
    }
 
    .card-content {
      padding: 15px;
    }

    .card h3 {
      margin: 0; 
      color: #222;
      font-size: 18px;
    }

    .card p {
      font-size: 15px;
      margin-top: 8px;       
      color: #555;
    }

    @media (max-width: 700px) {
      .cards {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
